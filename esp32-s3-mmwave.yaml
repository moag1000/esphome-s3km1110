  # Zigbee Permit Join (180 seconds)
  - platform: template
    name: "Zigbee Permit Join"
    icon: "mdi:zigbee"
    on_press:
      - lambda: |-
          id(zb_bridge).send_permit_join(180);

  # Zigbee Network Info
  - platform: template
    name: "Zigbee Network Info"
    icon: "mdi:information"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(zb_bridge).send_network_info();

  # LD2420 controls
  # The one button worth having on a dashboard.
  - platform: template
    name: "Calibrate Radar"
    icon: "mdi:tune-vertical"
    on_press:
      - script.execute: run_calibration

  - platform: ld2420
    apply_config:
      name: "Radar Apply Config"
      id: radar_apply
      entity_category: config
    factory_reset:
      name: "Radar Factory Reset"
