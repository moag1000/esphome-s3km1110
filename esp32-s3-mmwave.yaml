################################################################################
# ESPHome: Waveshare S3KM1110 mmWave Presence Sensor + Bluetooth Proxy
#
# Board: ESP32-S3-DevKitC-1 N16R8 (16MB Flash, 8MB Octal PSRAM)
# Sensor: Waveshare HMMD mmWave Sensor (S3KM1110, 24GHz)
# Extras: BT Proxy, Web Server, Diagnostics
#
# Wiring (all on left pin header):
#   3V3    → 3V3 (Pin 1)
#   GND    → GND (Pin 2)
#   GPIO17 → RX  (Pin 4)  ← ESP TX to Sensor RX
#   GPIO18 → TX  (Pin 3)  ← ESP RX from Sensor TX
#   GPIO8  → OT2 (Pin 5)  ← Presence GPIO output (optional)
#
# Note: GPIO35-37 NOT available (used by Octal PSRAM on N16R8)
#
################################################################################

substitutions:
  name: "mmwave-presence"
  friendly_name: "mmWave Presence Sensor"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      # Release any pad hold left by latch_gpio17 on either UART pin. A held
      # pad ignores reconfiguration, so a pin latched as an output HIGH by the
      # previous run cannot serve as UART RX afterwards — it reads as a dead
      # output and receives nothing, whatever the wiring says.
      - lambda: |-
          gpio_hold_dis(GPIO_NUM_17);
          gpio_hold_dis(GPIO_NUM_18);
      - script.execute: led_set_boot
      - delay: 3s
      - lambda: 'id(led_manual_override) = false;'
      # Set LD2420 defaults if not already configured
      - if:
          condition:
            lambda: 'return id(ld2420_timeout).state == 0;'
          then:
            - number.set:
                id: ld2420_timeout
                value: 30
      - if:
          condition:
            lambda: 'return id(ld2420_max_gate).state == 0;'
          then:
            - number.set:
                id: ld2420_max_gate
                value: 8
      # Restore coordinator enabled state
      - if:
          condition:
            lambda: 'return id(coordinator_enabled);'
          then:
            - lambda: 'id(zb_bridge).send_wake();'
          else:
            - lambda: 'id(zb_bridge).send_sleep();'
  on_shutdown:
    then:
      - script.execute: latch_gpio17

# Patched LD2420 component: flushes UART RX buffer and resets buffer_pos_
# before setup() to prevent streaming data from corrupting command framing.
# Latch GPIO17 (UART TX to sensor) HIGH before any software restart.
# Prevents the LOW glitch during bootloader that locks up the S3KM1110.
# Note: Hardware reset (EN pin) is NOT covered — use external pull-up (10kΩ GPIO17→3V3).
script:
  - id: latch_gpio17
    then:
      - lambda: |-
          gpio_reset_pin(GPIO_NUM_17);
          gpio_set_direction(GPIO_NUM_17, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_17, 1);
          gpio_hold_en(GPIO_NUM_17);

  - id: update_status_led
    then:
      # Gate on change. The 2 s interval re-applied the same colour on every
      # tick, which costs a transition and four debug lines each time — about
      # 170k log lines a day saying nothing happened. The nested logic below is
      # unchanged; it just runs when the picture actually changes.
      - lambda: |-
          int want;
          if (id(zb_permit_join_active).state) {
            want = 0;
          } else if (id(presence_gpio).state || id(presence_uart).state) {
            want = 1;
          } else if (!id(zb_coordinator_ready).state) {
            want = 2;
          } else {
            want = 3;
          }
          if (want == id(led_state)) {
            return;
          }
          id(led_state) = want;
          id(apply_status_led).execute();

  - id: apply_status_led
    then:
      - if:
          condition:
            binary_sensor.is_on: zb_permit_join_active
          then:
            # Orange blinking - Permit Join
            - light.turn_on:
                id: onboard_led
                red: 100%
                green: 50%
                blue: 0%
                brightness: 50%
                effect: "Blink"
          else:
            - if:
                condition:
                  or:
                    - binary_sensor.is_on: presence_gpio
                    - binary_sensor.is_on: presence_uart
                then:
                  # Green pulsing - Presence detected
                  - light.turn_on:
                      id: onboard_led
                      red: 0%
                      green: 100%
                      blue: 0%
                      brightness: 40%
                      effect: "Pulse"
                else:
                  - if:
                      condition:
                        binary_sensor.is_off: zb_coordinator_ready
                      then:
                        # Red - Zigbee not ready
                        - light.turn_on:
                            id: onboard_led
                            red: 100%
                            green: 0%
                            blue: 0%
                            brightness: 30%
                            effect: "none"
                      else:
                        # Normal operation - dim green
                        - light.turn_on:
                            id: onboard_led
                            red: 0%
                            green: 100%
                            blue: 0%
                            brightness: 20%
                            effect: "none"

  # One-press calibration.
  #
  # The area must be EMPTY for this. Calibration records the strongest return
  # each gate sees and sets that gate's threshold above it, so what it measures
  # is the room's own clutter — walls, furniture, a fan, a microwave running
  # nearby. Anything moving through during the run is learnt as clutter too,
  # and the thresholds end up above a person's reflection, which leaves the
  # sensor detecting nothing at all.
  #
  # Upstream puts the floor at 30 seconds and says longer catches more
  # intermittent noise sources.
  #
  # Order matters: leaving calibrate mode throws the result away (the component
  # copies the old config back), and apply_config writes the thresholds and
  # returns to Normal by itself. So: enter, wait, apply — never switch back by
  # hand in between.
  - id: run_calibration
    mode: restart
    then:
      # Grace period before anything is measured. The button is pressed from
      # inside the room it is about to measure, and calibration keeps peaks, so
      # a single walk to the door during the run poisons every gate crossed on
      # the way. Pressing and leaving has to be a valid way to use this.
      - lambda: 'id(calibration_leaving) = true;'
      - logger.log: "Calibration: leave the area now, measuring shortly"
      - delay: !lambda 'return (uint32_t) id(calibration_leadin).state * 1000;'
      - lambda: |-
          id(calibration_leaving) = false;
          id(calibration_active) = true;
      - logger.log: "Calibration measuring — keep the area clear until it finishes"
      - select.set:
          id: radar_mode
          option: "Calibrate"
      - delay: !lambda 'return (uint32_t) id(calibration_seconds).state * 1000;'
      - button.press: radar_apply
      - delay: 3s
      - lambda: 'id(calibration_active) = false;'
      - logger.log: "Calibration: thresholds written, back in Normal mode"

  - id: led_set_boot
    then:
      - light.turn_on:
          id: onboard_led
          red: 0%
          green: 0%
          blue: 100%
          brightness: 50%
          effect: "Pulse"

external_components:
  - source:
      type: git
      url: https://github.com/moag1000/esphome-s3km1110
      ref: a24c04cd26783c4060e15e4d9ace5860fa3d79bc
    components: [ld2420, zigbee_bridge]
    refresh: always

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # === PSRAM (Octal, N16R8) ===
      CONFIG_SPIRAM: y
      CONFIG_SPIRAM_MODE_OCT: y
      CONFIG_SPIRAM_SPEED_80M: y

      # === BLE 4.2 Only (disable 5.0 for TL100 compatibility) ===
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: n
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y

      # === WiFi/BLE Coexistence (Dual-Core) ===
      CONFIG_SW_COEXIST_ENABLE: y
      CONFIG_SW_COEXIST_PREFERENCE_BT: y

      # === BLE Connection Parameters ===
      CONFIG_BT_ACL_CONNECTIONS: "6"
      CONFIG_BT_GATT_MAX_SR_PROFILES: "8"

      # === Dual-Core: Pin BT to Core 0, WiFi uses Core 1 ===
      CONFIG_BT_BLUEDROID_PINNED_TO_CORE: "0"

      # === WiFi Buffer ===
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "10"
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "32"

psram:
  mode: octal
  speed: 80MHz

# Logging via USB-UART bridge (TXD/RXD on right header)
logger:
  level: DEBUG
  task_log_buffer_size: 4096
  logs:
    ld2420: WARN
    zigbee_bridge: DEBUG
    # Keep noisy components quiet
    esp32_ble: WARN
    esp32_ble_tracker: WARN
    bluetooth_proxy: WARN
    wifi: WARN
    api: WARN
    api.connection: WARN
    mqtt: WARN
    light: WARN
    esp32_rmt_led_strip: WARN
    script: WARN

# Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key
  services:
    # Zigbee Coordinator Reset (requires reset_pin configured)
    - service: zigbee_reset
      then:
        - lambda: |-
            id(zb_bridge).trigger_reset();

    # Zigbee Coordinator Recovery Mode (requires reset_pin and boot_pin)
    - service: zigbee_recovery_mode
      then:
        - lambda: |-
            id(zb_bridge).trigger_recovery_mode();

    # Zigbee Coordinator OTA from URL
    - service: zigbee_ota_url
      variables:
        url: string
      then:
        - logger.log:
            format: "Starting Zigbee OTA from URL: %s"
            args: ['url.c_str()']
        - lambda: |-
            id(zb_bridge).start_ota_from_url(url);

# MQTT for Zigbee device forwarding (discovery off — native API handles HA entities)
mqtt:
  broker: !secret mqtt_broker
  discovery: false
  topic_prefix: "zigbee_bridge"

ota:
  - platform: esphome
    password: !secret ota_password
    on_end:
      then:
        - script.execute: latch_gpio17

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  domain: .wildtierpark.local

  ap:
    ssid: "${name}-fallback"
    password: !secret ap_password

captive_portal:

# --- Local Web Server (http://<ip>:80) ---
web_server:
  port: 80
  version: 3
  local: true

# --- Time sync from HA (for uptime, timestamps) ---
time:
  - platform: homeassistant
    id: ha_time

# --- Bluetooth Proxy (same config as btproxy-beurer-s3) ---
esp32_ble:

esp32_ble_tracker:
  scan_parameters:
    interval: 60ms
    window: 30ms
    active: true
    continuous: true

bluetooth_proxy:
  active: true
  cache_services: false

# --- Onboard RGB LED (GPIO48) with automatic status indication ---
light:
  - platform: esp32_rmt_led_strip
    id: onboard_led
    name: "Status LED"
    pin: GPIO48
    num_leds: 1
    rgb_order: RBG
    chipset: WS2812
    restore_mode: ALWAYS_OFF
    effects:
      - pulse:
          name: "Pulse"
          transition_length: 500ms
          update_interval: 500ms
      - strobe:
          name: "Blink"
          colors:
            - state: true
              duration: 500ms
            - state: false
              duration: 500ms

# --- Status LED Control ---
globals:
  - id: led_manual_override
    type: bool
    restore_value: no
    initial_value: 'false'
  # Last LED state applied by update_status_led; -1 forces the first apply.
  - id: led_state
    type: int
    restore_value: no
    initial_value: '-1'
  # True while run_calibration is in progress; drives the LED and the status text.
  - id: calibration_active
    type: bool
    restore_value: no
    initial_value: 'false'
  # True during the grace period before measuring starts.
  - id: calibration_leaving
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: mmwave_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: coordinator_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'

interval:
  # Update status LED every 2 seconds (unless manually overridden)
  - interval: 2s
    then:
      - if:
          condition:
            lambda: 'return !id(led_manual_override);'
          then:
            - script.execute: update_status_led

# --- UARTs ---
uart:
  # UART to S3KM1110 mmWave (GPIO17 TX, GPIO18 RX)
  # Pull-up on TX keeps the line HIGH (UART idle) during ESP32 boot,
  # preventing the sensor from interpreting a low-going glitch as a break.
  - id: uart_mmwave
    tx_pin:
      number: GPIO17
      mode:
        output: true
        pullup: true
    rx_pin: GPIO18
    baud_rate: 115200
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 2048

  # UART to ESP32-C5 Zigbee Coordinator (GPIO15 TX, GPIO16 RX)
  - id: uart_zigbee
    tx_pin: GPIO15
    rx_pin: GPIO16
    baud_rate: 115200
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 2048

# --- Zigbee Bridge to ESP32-C5 ---
zigbee_bridge:
  id: zb_bridge
  uart_id: uart_zigbee
  coordinator_status_id: zb_coordinator_status
  last_event_id: zb_last_event
  network_info_id: zb_network_info
  device_count_id: zb_device_count
  zigbee_channel_id: zb_channel
  coordinator_ready_id: zb_coordinator_ready
  permit_join_id: zb_permit_join_active
  # OTA sensors (optional)
  ota_progress_id: zb_ota_progress
  ota_status_id: zb_ota_status
  # Hardware recovery pins (optional - connect to C5/H2 EN and BOOT pins)
  # Uncomment when hardware is wired:
  # reset_pin: GPIO4   # Connect to C5/H2 EN pin
  # boot_pin: GPIO5    # Connect to C5/H2 GPIO9 (C5) or GPIO8 (H2)
  # MQTT Mode (for WiFi-capable coordinators like C5+)
  # When enabled, coordinator connects directly to MQTT instead of via S3
  mqtt_mode:
    broker: !secret mqtt_broker
    port: 1883
    username: !secret mqtt_user
    password: !secret mqtt_password
    topic_prefix: "zigbee2mqtt"

# --- LD2420 component (protocol-compatible with S3KM1110) ---
ld2420:
  id: mmwave_radar
  uart_id: uart_mmwave
  # Must match the uart above: the recovery cycle rebuilds the port itself.
  recovery_tx_pin: 17
  recovery_rx_pin: 18

# ===========================================================================
# Binary Sensors
# ===========================================================================
binary_sensor:
  # Hardware GPIO presence output (OT2 pin - instant, no UART parsing needed)
  - platform: gpio
    id: presence_gpio_raw
    pin:
      number: GPIO8
      # Pulldown, not a bare input. OT2 is the only presence path left when the
      # UART is down, and a bare input on a disconnected wire floats HIGH — it
      # reports permanent presence, which is worse than reporting nothing. With
      # the pulldown an unwired pin reads off and the fault is visible.
      mode:
        input: true
        pulldown: true
    internal: true
    filters:
      - delayed_off: 5s

  # GPIO Presence (respects mmWave enable switch)
  - platform: template
    id: presence_gpio
    name: "Presence (GPIO)"
    device_class: occupancy
    lambda: 'return id(mmwave_enabled) && id(presence_gpio_raw).state;'

  # UART-based presence detection via LD2420 component (internal)
  - platform: ld2420
    has_target:
      id: presence_uart_raw
      internal: true

  # Presence sensor (respects mmWave enable switch)
  - platform: template
    id: presence_uart
    name: "Presence"
    device_class: occupancy
    lambda: 'return id(mmwave_enabled) && id(presence_uart_raw).state;'

  # API connection status
  - platform: status
    name: "API Status"

  # Zigbee Coordinator ready
  - platform: template
    id: zb_coordinator_ready
    name: "Zigbee Coordinator Ready"
    device_class: connectivity
    entity_category: diagnostic

  # Zigbee Permit Join active
  - platform: template
    id: zb_permit_join_active
    name: "Zigbee Permit Join"

  # C5 WiFi Capability (shows if coordinator supports WiFi/MQTT mode)
  - platform: zigbee_bridge
    zigbee_bridge_id: zb_bridge
    c5_wifi_capable:
      name: "Coordinator WiFi Capable"
      id: zb_c5_wifi_capable

# ===========================================================================
# Sensors
# ===========================================================================
sensor:
  # --- mmWave ---
  - platform: ld2420
    moving_distance:
      name: "Target Distance"
      unit_of_measurement: "cm"

    # What the radar actually measures, per range slice. Each gate covers
    # roughly 70 cm, and presence is declared when a gate's energy crosses its
    # threshold — so these are the numbers the thresholds are compared against,
    # and the only way to see why a detection happened or did not.
    #
    # Off by default, and throttled to one value every 2 s when on. The radar
    # reports every frame, so sixteen unthrottled sensors would push a few
    # hundred state writes a second into the recorder for something only needed
    # while tuning. Enable the gates covering the distance in question in Home
    # Assistant (Settings -> Devices -> mmWave -> the entity -> Enable), watch,
    # then disable them again.
    #
    # Measured on this device at gate 0: energy swinging between 4877 and
    # 65441 against a move threshold of 60000, which is what a gate right on
    # the edge of triggering looks like.
    gate_energy:
      gate_0:
        name: "Energy Gate 0 (0-70 cm)"
        disabled_by_default: true
        filters: [throttle: 2s]
      gate_1:
        name: "Energy Gate 1 (70-140 cm)"
        disabled_by_default: true
        filters: [throttle: 2s]
      gate_2:
        name: "Energy Gate 2 (140-210 cm)"
        disabled_by_default: true
        filters: [throttle: 2s]
      gate_3:
        name: "Energy Gate 3 (210-280 cm)"
        disabled_by_default: true
        filters: [throttle: 2s]
      gate_4:
        name: "Energy Gate 4 (280-350 cm)"
        disabled_by_default: true
        filters: [throttle: 2s]
      gate_5:
        name: "Energy Gate 5 (350-420 cm)"
        disabled_by_default: true
        filters: [throttle: 2s]
      gate_6:
        name: "Energy Gate 6 (420-490 cm)"
        disabled_by_default: true
        filters: [throttle: 2s]
      gate_7:
        name: "Energy Gate 7 (490-560 cm)"
        disabled_by_default: true
        filters: [throttle: 2s]
      gate_8:
        name: "Energy Gate 8 (560-630 cm)"
        disabled_by_default: true
        filters: [throttle: 2s]
      gate_9:
        name: "Energy Gate 9 (630-700 cm)"
        disabled_by_default: true
        filters: [throttle: 2s]
      gate_10:
        name: "Energy Gate 10 (700-770 cm)"
        disabled_by_default: true
        filters: [throttle: 2s]
      gate_11:
        name: "Energy Gate 11 (770-840 cm)"
        disabled_by_default: true
        filters: [throttle: 2s]
      gate_12:
        name: "Energy Gate 12 (840-910 cm)"
        disabled_by_default: true
        filters: [throttle: 2s]
      gate_13:
        name: "Energy Gate 13 (910-980 cm)"
        disabled_by_default: true
        filters: [throttle: 2s]
      gate_14:
        name: "Energy Gate 14 (980-1050 cm)"
        disabled_by_default: true
        filters: [throttle: 2s]
      gate_15:
        name: "Energy Gate 15 (1050-1120 cm)"
        disabled_by_default: true
        filters: [throttle: 2s]

  # --- WiFi Diagnostics ---
  - platform: wifi_signal
    id: wifi_signal_dbm
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: copy
    source_id: wifi_signal_dbm
    name: "WiFi Signal %"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: diagnostic

  # --- System Diagnostics ---
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

  - platform: internal_temperature
    name: "ESP Temperature"
    update_interval: 60s
    entity_category: diagnostic

  - platform: template
    name: "Free Memory"
    lambda: |-
      return heap_caps_get_free_size(MALLOC_CAP_8BIT) / 1024.0;
    unit_of_measurement: "KB"
    update_interval: 60s
    entity_category: diagnostic
    icon: mdi:memory

  # --- Zigbee ---
  - platform: template
    id: zb_device_count
    name: "Zigbee Device Count"
    accuracy_decimals: 0
    icon: "mdi:zigbee"
    entity_category: diagnostic

  - platform: template
    id: zb_channel
    name: "Zigbee Channel"
    accuracy_decimals: 0
    icon: "mdi:access-point"
    entity_category: diagnostic

  # Zigbee OTA Progress
  - platform: template
    id: zb_ota_progress
    name: "Zigbee OTA Progress"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:progress-upload"
    entity_category: diagnostic

# ===========================================================================
# Text Sensors (Diagnostics)
# ===========================================================================
text_sensor:
  # mmWave firmware
  - platform: ld2420
    fw_version:
      name: "Radar Firmware"

  # Electrical probe of the two sensor lines.
  #
  # This found a dead radar module. Both lines read "floating" for days while
  # the wiring and the config were correct; swapping in an identical sensor
  # turned both to "driven HIGH" and the radar came up on its own. Readings on
  # a healthy link: TX(18)=driven HIGH, OT2(8)=driven HIGH.
  #
  # "drained 0 bytes" says no UART frames arrive; it cannot say why. Sampling
  # each pin twice — once pulled down, once pulled up — separates the cases
  # that look identical from the protocol's point of view:
  #
  #   high/high  driven HIGH    module powered, line idle (UART locked)
  #   low/low    driven LOW     module holding the line down
  #   low/high   floating       nothing driving it: no wire, or no power
  #
  # Changing only the pull mode leaves the UART routing intact, so this costs
  # the radar nothing and runs alongside normal operation.
  - platform: template
    name: "Radar Line Probe"
    entity_category: diagnostic
    icon: "mdi:pulse"
    update_interval: 60s
    lambda: |-
      auto classify = [](gpio_num_t pin) -> const char * {
        gpio_set_pull_mode(pin, GPIO_PULLDOWN_ONLY);
        delay(2);
        int with_pulldown = gpio_get_level(pin);
        gpio_set_pull_mode(pin, GPIO_PULLUP_ONLY);
        delay(2);
        int with_pullup = gpio_get_level(pin);
        gpio_set_pull_mode(pin, GPIO_PULLDOWN_ONLY);
        if (with_pulldown == 1 && with_pullup == 1) return "driven HIGH";
        if (with_pulldown == 0 && with_pullup == 0) return "driven LOW";
        if (with_pulldown == 0 && with_pullup == 1) return "floating";
        return "unstable";
      };
      // Self-test on a spare pin before trusting anything else. GPIO9 is
      // unused, so drive it both ways in INPUT_OUTPUT mode — which keeps the
      // pad's input path alive, unlike a plain output, where gpio_get_level()
      // reads 0 no matter what the pad does. If the probe cannot tell a pin it
      // drives itself from a floating one, the other two readings mean nothing.
      const gpio_num_t test = GPIO_NUM_9;
      gpio_reset_pin(test);
      gpio_set_direction(test, GPIO_MODE_INPUT_OUTPUT);
      gpio_set_level(test, 1);
      delay(2);
      const char *saw_high = classify(test);
      gpio_set_level(test, 0);
      delay(2);
      const char *saw_low = classify(test);
      gpio_reset_pin(test);
      const bool trustworthy = (strcmp(saw_high, "driven HIGH") == 0) &&
                               (strcmp(saw_low, "driven LOW") == 0);

      char buf[128];
      snprintf(buf, sizeof(buf), "TX(18)=%s OT2(8)=%s selftest=%s",
               classify(GPIO_NUM_18), classify(GPIO_NUM_8),
               trustworthy ? "OK" : "FAILED");
      return std::string(buf);

  # Gates calibration could not find a usable threshold for, because their own
  # clutter already reaches the top of the uint16 range. Those gates report
  # presence continuously, and this is the only place that says so.
  - platform: template
    name: "Saturated Gates"
    id: saturated_gates
    icon: "mdi:alert-circle-outline"
    update_interval: 30s
    lambda: |-
      uint8_t n = id(mmwave_radar).get_saturated_gate_count();
      if (n == 0) {
        return std::string("none — thresholds sit above the clutter");
      }
      char buf[96];
      snprintf(buf, sizeof(buf),
               "%u gate(s) — raise the minimum gate past them, or move the sensor", n);
      return std::string(buf);

  # What the radar is doing, in one line. Calibration is otherwise invisible:
  # the mode select flips, nothing else moves, and the thresholds only change
  # at the very end.
  - platform: template
    name: "Radar Status"
    id: radar_status
    icon: "mdi:radar"
    update_interval: 5s
    lambda: |-
      if (id(calibration_leaving)) {
        return std::string("Leave the area — measuring starts shortly");
      }
      if (id(calibration_active)) {
        return std::string("Calibrating — keep the area clear");
      }
      if (!id(mmwave_enabled)) {
        return std::string("Switched off");
      }
      if (isnan(id(ld2420_move_sens).state)) {
        return std::string("No answer from radar");
      }
      return std::string(id(presence_uart).state ? "Presence" : "Clear");

  # ESPHome version
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

  # Zigbee
  - platform: template
    id: zb_coordinator_status
    name: "Zigbee Status"
    icon: "mdi:zigbee"
    entity_category: diagnostic

  - platform: template
    id: zb_last_event
    name: "Zigbee Last Event"
    icon: "mdi:message-text"
    entity_category: diagnostic
    internal: true

  - platform: template
    id: zb_network_info
    name: "Zigbee Network"
    icon: "mdi:access-point-network"
    entity_category: diagnostic

  # Zigbee OTA Status
  - platform: template
    id: zb_ota_status
    name: "Zigbee OTA Status"
    icon: "mdi:cloud-upload"
    entity_category: diagnostic

  # WiFi info
  - platform: wifi_info
