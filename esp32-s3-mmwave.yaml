    restart_module:
      name: "Radar Restart"
      entity_category: config
    revert_config:
      name: "Radar Revert Config"
      entity_category: config

# ===========================================================================
# Gate sensitivity configuration (all gates required by LD2420 timeout_group)
# ===========================================================================
# ===========================================================================
# Radar configuration
#
# The 32 per-gate threshold numbers are gone. The component offers a second
# style for the same registers: one "gate select" number plus a single pair of
# threshold numbers that follow whichever gate is selected. Same reach, three
# entities instead of thirty-two.
#
# Most of the time none of them need touching. The two sensitivity factors
# below drive the calibration, which measures what the room actually looks like
# and derives all 32 thresholds from it.
# ===========================================================================
number:
  - platform: ld2420
    presence_timeout:
      name: "Presence Timeout"
      id: ld2420_timeout
    min_gate_distance:
      name: "Min Detection Gate"
      id: ld2420_min_gate
    max_gate_distance:
      name: "Max Detection Gate"
      id: ld2420_max_gate

    # Sensitivity factors, 0 to 1. Calibration sets each gate's move threshold
    # to peak x (2 + factor) and its still threshold to peak x (2 + factor/2),
    # where peak is the loudest clutter that gate saw in the empty room.
    # Lower factor = threshold closer to that clutter = more sensitive, and
    # more prone to false triggers.
    gate_move_sensitivity:
      name: "Sensitivity Factor (moving)"
      id: ld2420_move_sens
    gate_still_sensitivity:
      name: "Sensitivity Factor (still)"
      id: ld2420_still_sens

    # Manual per-gate access, for the rare case calibration is not enough.
    # gate_select picks the gate; the two thresholds show and set that gate.
    gate_select:
      name: "Gate (manual editing)"
      id: ld2420_gate_select
      disabled_by_default: true
    move_threshold:
      name: "Move Threshold (selected gate)"
      disabled_by_default: true
    still_threshold:
      name: "Still Threshold (selected gate)"
      disabled_by_default: true

  # How long calibration samples the empty room before the thresholds are
  # written. Upstream's floor is 30 s; longer runs catch noise that only shows
  # up occasionally, such as a microwave or a fan cycling on.
  # Grace period between pressing the button and the first measurement, so the
  # room can be left without the walk out being measured as clutter.
  - platform: template
    name: "Calibration Lead-in"
    id: calibration_leadin
    min_value: 0
    max_value: 120
    step: 10
    initial_value: 30
    restore_value: true
    optimistic: true
    unit_of_measurement: "s"
    entity_category: config
    icon: "mdi:timer-sand"

  - platform: template
    name: "Calibration Duration"
    id: calibration_seconds
    min_value: 30
    max_value: 180
    step: 15
    initial_value: 45
    restore_value: true
    optimistic: true
    unit_of_measurement: "s"
    entity_category: config
    icon: "mdi:timer-cog"


switch:
  - platform: template
    name: "mmWave Sensor"
    id: mmwave_switch
    icon: "mdi:motion-sensor"
    restore_mode: RESTORE_DEFAULT_ON
    lambda: 'return id(mmwave_enabled);'
    turn_on_action:
      - globals.set:
          id: mmwave_enabled
          value: 'true'
    turn_off_action:
      - globals.set:
          id: mmwave_enabled
          value: 'false'

  - platform: template
    name: "Zigbee Coordinator"
    id: coordinator_switch
    icon: "mdi:zigbee"
    restore_mode: RESTORE_DEFAULT_ON
    lambda: 'return id(coordinator_enabled);'
    turn_on_action:
      - globals.set:
          id: coordinator_enabled
          value: 'true'
      - lambda: 'id(zb_bridge).send_wake();'
    turn_off_action:
      - globals.set:
          id: coordinator_enabled
          value: 'false'
      - lambda: 'id(zb_bridge).send_sleep();'

  # MQTT Mode Switch (only effective when C5+ with WiFi is connected)
  # ON = Coordinator connects directly to MQTT broker
  # OFF = Coordinator sends data via UART to S3 which bridges to MQTT
  - platform: zigbee_bridge
    zigbee_bridge_id: zb_bridge
    name: "Zigbee MQTT Mode"
    id: zb_mqtt_mode

select:
  - platform: ld2420
    operating_mode:
      name: "Operating Mode"
      id: radar_mode
      entity_category: config

  # Sensitivity in words. Writes both factors; calibration turns them into
  # thresholds. Changing this alone does nothing until the next calibration —
  # the status sensor says so.
  - platform: template
    name: "Sensitivity Preset"
    id: sensitivity_preset
    icon: "mdi:motion-sensor"
    optimistic: true
    restore_value: true
    options:
      - "High (detects small motion)"
      - "Medium"
      - "Low (fewer false triggers)"
    initial_option: "Medium"
    on_value:
      - lambda: |-
          float move = 0.40f, still = 0.40f;
          if (x == "High (detects small motion)") { move = 0.10f; still = 0.10f; }
          else if (x == "Low (fewer false triggers)") { move = 0.80f; still = 0.80f; }
          id(ld2420_move_sens).publish_state(move);
          id(ld2420_still_sens).publish_state(still);
          id(ld2420_move_sens).make_call().set_value(move).perform();
          id(ld2420_still_sens).make_call().set_value(still).perform();
